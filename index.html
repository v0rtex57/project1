
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapy obrazów</title>
</head>
<body>

    <h1>Mapy obrazów HTML</h1>

    <h2>1. ZS2 Stargard</h2>
    <img src="zs2.png" usemap="#map1" alt="ZS2">
    <map name="map1">
        <area shape="rect" coords="0,0,150,100"
              href="https://zs2-stargard.edu.pl/"
              alt="Strona ZS2">
        <area shape="rect" coords="150,0,300,100"
              href="https://stargard.eu"
              target="_blank" alt="Miasto Stargard">
    </map>

    <br>

    <h2>2. Matiz</h2>
    <img src="matiz.jpg" usemap="#matiz" alt="Matiz">
    <map name="matiz">
        <area shape="circle" coords="416,353,27"
              href="https://stargard.eu"
              target="_blank" alt="Stargard">
    </map>

    <br>

    <h2>3. Polska</h2>
    <img src="polska.jpg" usemap="#polska" alt="Mapa Polski">
    <map name="polska">
        <area shape="poly"
              coords="8,62,59,48,92,39,120,18,119,62,128,87,108,101,120,115,100,130,84,131,55,141,17,158,2,133,16,113,10,79"
              href="https://stargard.eu"
              target="_blank" alt="Stargard">
    </map>

    <br>

    <h2>4. Rower</h2>
    <img src="rower.jpg" usemap="#rower" alt="Rower">
    <map name="rower">
        <area shape="circle"
              coords="75,500,80"
              href="https://rowerowo.pl/"
              target="_blank"
              alt="Sklep rowerowy">
    </map>

    <br>

    <h2>5. Komputer</h2>
    <img src="komputer.jpg" usemap="#komputer" alt="Komputer">
    <map name="komputer">
        <area shape="rect"
              coords="0,0,300,200"
              href="https://www.x-kom.pl/"
              target="_blank"
              alt="Sklep komputerowy">
    </map>

    <br>

    <h2>6. Piłka nożna</h2>
    <img src="pilka.jpg" usemap="#pilka" alt="Piłka nożna">
    <map name="pilka">
        <area shape="circle"
              coords="150,150,100"
              href="https://www.sport-shop.pl/"
              target="_blank"
              alt="Sklep sportowy">
    </map>

    <br>

    
    <h2>7. Telefon</h2>
    <img src="telefon.jpg" usemap="#telefon" alt="Telefon">
    <map name="telefon">
        <area shape="rect"
              coords="50,20,180,300"
              href="https://www.samsung.com/pl/"
              target="_blank"
              alt="Telefony Samsung">
    </map>

    <br>

    
    <h2>8. Książka</h2>
    <img src="ksiazka.jpg" usemap="#ksiazka" alt="Książka">
    <map name="ksiazka">
        <area shape="rect"
              coords="0,0,250,350"
              href="https://www.empik.com/"
              target="_blank"
              alt="Księgarnia Empik">
    </map>

</body>
</html>
